<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mochi">
  <!-- Beige dumpling-bear Mochi: round chonky body, tiny ears, bead eyes, blush cheeks -->
  <!-- Ears -->
  <circle cx="28" cy="26" r="13" fill="#F0DEC2"/>
  <circle cx="72" cy="26" r="13" fill="#F0DEC2"/>
  <circle cx="28" cy="26" r="6.5" fill="#E5CBA6"/>
  <circle cx="72" cy="26" r="6.5" fill="#E5CBA6"/>
  <!-- Body / head (chonky round dumpling) -->
  <ellipse cx="50" cy="56" rx="38" ry="36" fill="#F5E6CC"/>
  <!-- Muzzle patch -->
  <ellipse cx="50" cy="64" rx="17" ry="13" fill="#FBF3E2"/>
  <!-- Bead eyes -->
  <circle cx="38" cy="52" r="4.2" fill="#3A2E1F"/>
  <circle cx="62" cy="52" r="4.2" fill="#3A2E1F"/>
  <circle cx="39.4" cy="50.6" r="1.3" fill="#FFFFFF"/>
  <circle cx="63.4" cy="50.6" r="1.3" fill="#FFFFFF"/>
  <!-- Nose + mouth -->
  <ellipse cx="50" cy="61" rx="3.2" ry="2.4" fill="#7A5C3E"/>
  <path d="M50 63.4 Q50 68 45.5 68.5 M50 63.4 Q50 68 54.5 68.5" fill="none" stroke="#7A5C3E" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Blush cheeks -->
  <ellipse cx="29" cy="62" rx="6" ry="4" fill="#FFB7A8" opacity="0.7"/>
  <ellipse cx="71" cy="62" rx="6" ry="4" fill="#FFB7A8" opacity="0.7"/>
</svg>
